# Chunker x retriever (x reranker) grid. Run: python -m raglab eval-retrieval
corpus: {type: squad, path: data/dev-v2.0.json}
cache_path: .cache/raglab.sqlite
device: auto

questions: {tune_frac: 0.3, seed: 0, n_answerable: 1000}  # sampled from the test split
k_values: [1, 3, 5, 10, 20]

chunkers:
  - {type: fixed, size: 64, overlap: 16}
  - {type: fixed, size: 128, overlap: 32}
  - {type: fixed, size: 256, overlap: 64}
  - {type: sentence, max_words: 120, overlap_sentences: 1}
  - {type: paragraph}

retrievers:
  - {type: bm25}
  - {type: dense, model: sentence-transformers/all-MiniLM-L6-v2}
  - {type: dense, model: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}
  - type: hybrid
    members:
      - {type: bm25}
      - {type: dense, model: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}

reranker: {model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 20}
rerank_on: ["hybrid(bm25+dense:bge-small-en-v1.5)"]
