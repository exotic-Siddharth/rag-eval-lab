# Production pipeline: the best retrieval config from results/retrieval_grid.md.
# Run: python -m raglab eval-e2e   |   python -m raglab serve   |   python -m raglab ask "..."
corpus: {type: squad, path: data/dev-v2.0.json}
# corpus: {type: dir, path: my_docs/, questions: my_questions.jsonl}   # bring your own documents
cache_path: .cache/raglab.sqlite
device: auto

chunker: {type: paragraph, max_words: 400}
retriever:
  type: hybrid
  members:
    - {type: bm25}
    - {type: dense, model: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}
reranker: {model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 20}
retrieve_k: 20
context_k: 3

generator: {type: local, model: Qwen/Qwen3-0.6B, max_new_tokens: 32}
generators:   # selectable with `eval-e2e --generator <name>`
  extractive: {type: extractive}
  local: {type: local, model: Qwen/Qwen3-0.6B, max_new_tokens: 32}
  claude: {type: claude, model: claude-opus-5-5, effort: medium}

guardrails:
  drop_injected_chunks: true
  min_confidence: null        # reranker-logit gate; set from results/e2e_*.json -> chosen
  grounding_threshold: 0.5

eval:
  seed: 0
  tune_frac: 0.3
  tune: {n_answerable: 75, n_unanswerable: 75}
  test: {n_answerable: 200, n_unanswerable: 200}
  gate_pass_rates: [1.0, 0.95, 0.9, 0.8, 0.7, 0.6, 0.5]
  grounding_thresholds: [0.0, 0.5, 0.75, 1.0]
  latency_queries: 50
